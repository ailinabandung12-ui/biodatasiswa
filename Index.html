<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Saya - Tema Langit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            color: #fff;
            position: relative;
            overflow-x: hidden;
            /* Latar gradasi langit (senja ke malam) */
            background: linear-gradient(to bottom, #1a237e 0%, #4a148c 30%, #880e4f 60%, #ff6f00 100%);
        }

        /* Efek awan bergerak */
        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 100px;
            animation: moveCloud 30s linear infinite;
        }

        .cloud:nth-child(1) {
            width: 300px;
            height: 80px;
            top: 10%;
            left: -300px;
            animation-delay: 0s;
        }

        .cloud:nth-child(2) {
            width: 400px;
            height: 100px;
            top: 30%;
            left: -400px;
            animation-delay: 8s;
            animation-duration: 40s;
        }

        .cloud:nth-child(3) {
            width: 250px;
            height: 70px;
            top: 55%;
            left: -250px;
            animation-delay: 15s;
            animation-duration: 25s;
        }

        @keyframes moveCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(150vw); }
        }

        /* Efek bintang berkelap-kelip */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 55%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Kartu Biodata */
        .biodata-card {
            position: relative;
            z-index: 10;
            max-width: 500px;
            margin: 60px auto;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
            object-fit: cover;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            font-size: 48px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .title {
            font-size: 16px;
            color: #e0e0ff;
            margin-bottom: 30px;
            font-style: italic;
        }

        .info-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            text-align: left;
            transition: 0.3s;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateX(5px);
        }

        .info-label {
            font-weight: 600;
            width: 120px;
            color: #bbdefb;
        }

        .info-value {
            flex: 1;
        }

        /* Responsif untuk HP */
        @media (max-width: 600px) {
            .biodata-card {
                margin: 30px 15px;
                padding: 30px 20px;
            }
            h1 { font-size: 24px; }
            .info-item { flex-wrap: wrap; }
            .info-label { width: 100%; margin-bottom: 3px; }
        }
    </style>
</head>
<body>
    <!-- Latar Awan -->
    <div class="clouds">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>

    <!-- Latar Bintang -->
    <div class="stars" id="stars-container"></div>

    <!-- Kartu Biodata -->
    <div class="biodata-card">
        <div class="profile-img">👤</div>
        <h1>Nama Kamu Disini</h1>
        <p class="title">Penggemar Langit & Teknologi</p>

        <div class="info-item">
            <span class="info-label">📅 Tanggal Lahir</span>
            <span class="info-value">01 Januari 2000</span>
        </div>

        <div class="info-item">
            <span class="info-label">📍 Asal</span>
            <span class="info-value">Bandung, Jawa Barat</span>
        </div>

        <div class="info-item">
            <span class="info-label">📧 Email</span>
            <span class="info-value">emailkamu@gmail.com</span>
        </div>

        <div class="info-item">
            <span class="info-label">🎓 Pendidikan</span>
            <span class="info-value">Mahasiswa / Pelajar</span>
        </div>

        <div class="info-item">
            <span class="info-label">💡 Hobi</span>
            <span class="info-value">Melihat langit, Coding, Membaca</span>
        </div>
    </div>

    <!-- Script buat bintang otomatis -->
    <script>
        const starsContainer = document.getElementById('stars-container');
        const jumlahBintang = 150;

        for (let i = 0; i < jumlahBintang; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.width = (Math.random() * 3 + 2) + 'px';
            star.style.height = star.style.width;
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
